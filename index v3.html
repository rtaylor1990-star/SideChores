<style>

<div id="app" class="max-w-lg mx-auto p-4"></div>
<script>
window.onerror=function(m,s,l){document.getElementById('app').innerHTML='<div class="box b-pink p-4 text-red-400">ERR L'+l+': '+m+'</div>'};

const firebaseConfig={
  apiKey:"AIzaSyAJM_Ad9KzHkl_8djqNEcRusxy3lEac3T8",

firebase.initializeApp(firebaseConfig);
const dbRef=firebase.database().ref('sidechores_state');

const KEY='sc_arc_v7',DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],AV=['👾','🤖','🦖','🚀','⚡','🦊','🐉','🎮'];
const CATS={
  weekday:[{id:'morning',lb:'🌅 MORNING'},{id:'after_school',lb:'🎒 AFTER SCHOOL'},{id:'bedtime',lb:'🌙 BEDTIME'}],
  weekend:[{id:'morning',lb:'🌅 MORNING'},{id:'afternoon',lb:'☀️ AFTERNOON'},{id:'bedtime',lb:'🌙 BEDTIME'}]
};
const CAT_LABELS={morning:'Morning',after_school:'After School',afternoon:'Afternoon',bedtime:'Bedtime'};

// Enhanced Retro Audio + Haptics
const fx={
  c:null,
  vib(pat){try{if(navigator.vibrate)navigator.vibrate(pat)}catch(e){}},
  tone(f,d=0.07,type='square'){
    try{
      if(!this.c)this.c=new(window.AudioContext||window.webkitAudioContext)();
      if(this.c.state==='suspended')this.c.resume();
      f.forEach((v,i)=>{
        let o=this.c.createOscillator(),g=this.c.createGain();
        o.type=type;o.frequency.value=v;g.gain.value=0.05;
        o.connect(g);g.connect(this.c.destination);
        o.start(this.c.currentTime+i*d);o.stop(this.c.currentTime+(i+1)*d);
      });
    }catch(e){}
  },
  tap(){this.vib(25);this.tone([620],0.05)},
  check(){this.vib([35,30,50]);this.tone([880,1174,1567],0.06)},
  uncheck(){this.vib(40);this.tone([380,260],0.06)},
  win(){this.vib([60,40,60,40,120]);this.tone([523,659,784,1046,784,1046],0.08)},
  coin(){this.vib([40,30,80]);this.tone([987,1318],0.09)},
  err(){this.vib([100,50,100]);this.tone([180,120],0.09,'sawtooth')}
};

const iso=(off=0)=>{let d=new Date();d.setDate(d.getDate()+off);return d.toISOString().split('T')[0]};
const dName=(s)=>{let p=s.split('-').map(Number);return DAYS[new Date(p[0],p[1]-1,p[2]).getDay()]};
const isWknd=(dn)=>dn==='Sat'||dn==='Sun';
const monOf=(s)=>{let p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]),day=d.getDay();d.setDate(d.getDate()-day+(day===0?-6:1));return d.toISOString().split('T')[0]};
const wkDates=(m)=>{let p=m.split('-').map(Number);return[0,1,2,3,4,5,6].map(i=>new Date(p[0],p[1]-1,p[2]+i).toISOString().split('T')[0])};
const tier=(pct,miss)=>miss?0:pct>=100?60:pct>=75?30:pct>=50?15:0;
const fmtMoney=(v)=>'£'+Number(v||0).toFixed(2);
const nowTime=()=>{let n=new Date();return n.toTimeString().slice(0,5)};

function defState(){
  let t=iso(),m=monOf(t);
  return{pPin:'1234',off:0,lastD:t,wkM:m,streakBonus:5.00,
    kids:[
      {id:'k1',name:'James',av:'🚀',pin:'1234',dSpent:0,wBank:0,wUnl:'',wSpent:0,money:0,streakPaidWk:''},
      {id:'k2',name:'Harrison',av:'🦖',pin:'1234',dSpent:0,wBank:0,wUnl:'',wSpent:0,money:0,streakPaidWk:''}
    ],
    tasks:[
      {id:'t1',title:'Make Bed & Brush Teeth AM',sched:'weekday',cat:'morning',req:true,wMins:0,to:'all'},
      {id:'t2',title:'Reading / Homework 20m',sched:'weekday',cat:'after_school',req:false,wMins:0,to:'all'},
      {id:'t3',title:'Pack School Bag & Shoes',sched:'weekday',cat:'after_school',req:false,wMins:0,to:'all'},
      {id:'t4',title:'Tidy Room & Brush Teeth PM',sched:'weekday',cat:'bedtime',req:true,wMins:0,to:'all'},
      {id:'t5',title:'Make Bed & Brush Teeth AM',sched:'weekend',cat:'morning',req:true,wMins:0,to:'all'},
      {id:'t6',title:'Hoover Bedroom',sched:'weekend',cat:'afternoon',req:false,wMins:15,to:'all'},
      {id:'t7',title:'Wash Car / Tidy Garden',sched:'weekend',cat:'afternoon',req:false,wMins:20,to:'all'},
      {id:'t8',title:'Tidy Toys & Brush Teeth PM',sched:'weekend',cat:'bedtime',req:true,wMins:0,to:'all'}
    ],
    bounties:[
      {id:'b1',title:'Wash & Vacuum Family Car',amt:2.50,repeat:'weekly',to:'all'},
      {id:'b2',title:'Tidy Garden / Sweep Patio',amt:1.50,repeat:'weekly',to:'all'},
      {id:'b3',title:'Deep Clean Toy Box',amt:1.00,repeat:'once',to:'all'}
    ],
    comp:{},reqs:[],logs:[]};
}

let S=(()=>{try{let r=JSON.parse(localStorage.getItem(KEY));return(r&&r.kids)?normalizeState(r):defState()}catch(e){return defState()}})();
let U={scr:'sel',tgt:null,pin:'',err:false,kid:null,tab:'mat',mKid:S.kids[0]?.id||'k1',qType:'routine',qSched:'weekday',cloud:'connecting',banner:''};

function normalizeState(raw){
  let base=defState();
  let st={...base,...raw};
  st.streakBonus=raw.streakBonus!==undefined?Number(raw.streakBonus):5.00;
  st.kids=(Array.isArray(raw.kids)?raw.kids:base.kids).map(k=>({
    money:0,streakPaidWk:'',...k
  }));
  st.tasks=Array.isArray(raw.tasks)?raw.tasks:base.tasks;
  st.bounties=Array.isArray(raw.bounties)?raw.bounties:base.bounties;
  st.comp=raw.comp&&typeof raw.comp==='object'?raw.comp:{};
  st.reqs=Array.isArray(raw.reqs)?raw.reqs:[];
  st.logs=Array.isArray(raw.logs)?raw.logs:[];
  return st;
}

const save=()=>{
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  dbRef.set(S).then(()=>{if(U.cloud!=='online'){U.cloud='online';render()}}).catch(()=>{U.cloud='error';render()});
};

dbRef.on('value',(snap)=>{
  let val=snap.val();
  U.cloud='online';
  if(val&&val.kids){
    S=normalizeState(val);
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(!S.kids.find(k=>k.id===U.mKid))U.mKid=S.kids[0]?.id||'';
    render();
  }else{
    save();
    render();
  }
},()=>{
  U.cloud='error';
  render();
});

const curD=()=>iso(S.off||0);

function addLog(kidId,action,dateStr,taskId,type='routine'){
  let k=S.kids.find(x=>x.id===kidId);
  S.logs.unshift({
    id:'l'+Date.now()+Math.random().toString(36).slice(2,5),
    kid:kidId,
    kName:k?k.name:'Kid',
    action,
    date:dateStr,
    time:nowTime(),
    taskId,
    type
  });
  if(S.logs.length>30)S.logs=S.logs.slice(0,30);
}

function showBanner(msg){
  U.banner=msg;
  render();
  setTimeout(()=>{if(U.banner===msg){U.banner='';render()}},3800);
}

function sync(){
  let d=curD(),m=monOf(d),dn=dName(d),changed=false;
  if(S.wkM!==m){
    S.wkM=m;
    S.kids.forEach(k=>{k.wBank=0;k.wSpent=0;k.wUnl='';k.streakPaidWk=''});
    changed=true;
  }
  if(S.lastD!==d){
    S.lastD=d;
    S.kids.forEach(k=>k.dSpent=0);
    S.reqs=S.reqs.filter(r=>r.pool!=='daily');
    changed=true;
  }
  if(isWknd(dn)){
    S.kids.forEach(k=>{if(k.wUnl!==m){k.wBank=wkStats(k.id,m).mins;k.wUnl=m;changed=true}});
  }
  if(changed)save();
}

const kTasks=(kid,sched)=>S.tasks.filter(t=>t.sched===sched&&(t.to==='all'||t.to===kid));
const kBounties=(kid)=>S.bounties.filter(b=>b.to==='all'||b.to===kid);

function dStats(kid,d){
  let sched=isWknd(dName(d))?'weekend':'weekday';
  let ts=kTasks(kid,sched),done=(S.comp[d]?.[kid])||[];
  let c=ts.filter(t=>done.includes(t.id)).length,pct=ts.length?Math.round(c/ts.length*100):0;
  let miss=ts.filter(t=>t.req).some(t=>!done.includes(t.id));
  return{pct,miss,mins:tier(pct,miss),done,sched,total:ts.length};
}

// Mon-Fri 5-Day Streak Calculation (100% completion on Mon-Fri days)
function streakStats(kid,m){
  let wd=wkDates(m),mf=wd.slice(0,5),ts=kTasks(kid,'weekday');
  let daysHit=0,dayStatus=[];
  mf.forEach(dayStr=>{
    let done=(S.comp[dayStr]?.[kid])||[];
    let hit=ts.length>0 && ts.every(t=>done.includes(t.id));
    if(hit)daysHit++;
    dayStatus.push({day:dName(dayStr),date:dayStr,hit});
  });
  return{daysHit,dayStatus,complete:daysHit===5 && ts.length>0};
}

function wkStats(kid,m){
  let wd=wkDates(m),mf=wd.slice(0,5),ts=kTasks(kid,'weekday'),tot=ts.length*5,c=0;
  mf.forEach(d=>{let done=(S.comp[d]?.[kid])||[];c+=ts.filter(t=>done.includes(t.id)).length});
  let pct=tot?Math.round(c/tot*100):0;
  return{pct,c,tot,mins:tier(pct,false),wd};
}

function wkBonusMins(kid,m){
  let wd=wkDates(m),ss=[wd[5],wd[6]],ts=kTasks(kid,'weekend'),mins=0;
  ss.forEach(d=>{let done=(S.comp[d]?.[kid])||[];ts.forEach(t=>{if(done.includes(t.id)&&Number(t.wMins||0)>0)mins+=Number(t.wMins)})});
  return mins;
}

const bar=(av,cls)=>{let h='';for(let i=0;i<12;i++)h+=`<div class="cell ${i<Math.floor(av/5)?cls:''}"></div>`;return`<div class="grid grid-cols-12 gap-1 p-1 bg-black border-2 border-slate-700">${h}</div>`};

function goPin(t){fx.tap();U={...U,scr:'pin',tgt:t,pin:'',err:false};render()}
function hitPin(n){
  fx.tap();if(U.pin.length>=4)return;U.pin+=n;
  if(U.pin.length===4){
    let exp=U.tgt==='parent'?S.pPin:(S.kids.find(k=>k.id===U.tgt)?.pin||'1234');
    if(U.pin===exp){fx.win();U.scr=U.tgt==='parent'?'par':'kid';U.kid=U.tgt;U.pin=''}
    else{fx.err();U.err=true;U.pin=''}
  }render();
}

function togTask(kid,tid){
  let d=curD(),k=S.kids.find(x=>x.id===kid),t=S.tasks.find(x=>x.id===tid);
  if(!k||!t)return;
  if(!S.comp[d])S.comp[d]={};if(!S.comp[d][kid])S.comp[d][kid]=[];
  let a=S.comp[d][kid],i=a.indexOf(tid);
  if(i>-1){
    a.splice(i,1);
    fx.uncheck();
  }else{
    a.push(tid);
    addLog(kid,`Checked "${t.title}"`,d,tid,'routine');
    let ds=dStats(kid,d);
    let st=streakStats(kid,S.wkM);
    if(st.complete && k.streakPaidWk!==S.wkM && Number(S.streakBonus)>0){
      k.money=Number(k.money||0)+Number(S.streakBonus);
      k.streakPaidWk=S.wkM;
      fx.win();
      showBanner(`🔥 5-DAY STREAK! +${fmtMoney(S.streakBonus)} POCKET MONEY!`);
    }else if(ds.pct===100){
      fx.win();
      showBanner(`⚡ 100% DAILY QUESTS! MAX 60M ENERGY UNLOCKED!`);
    }else{
      fx.check();
    }
  }
  save();render();
}

function claimBounty(kid,bid){
  let b=S.bounties.find(x=>x.id===bid),k=S.kids.find(x=>x.id===kid);
  if(!b||!k)return;
  if(S.reqs.some(r=>r.pool==='bounty'&&r.kid===kid&&r.bountyId===bid))return;
  fx.coin();
  S.reqs.push({
    id:'r'+Date.now(),
    kid,
    pool:'bounty',
    bountyId:bid,
    title:b.title,
    amt:Number(b.amt||0),
    repeat:b.repeat||'weekly'
  });
  addLog(kid,`Claimed bounty "${b.title}" (${fmtMoney(b.amt)})`,curD(),bid,'bounty');
  showBanner(`💰 BOUNTY SENT TO PARENT FOR APPROVAL!`);
  save();render();
}

function reqTime(kid,pool,mins){
  fx.tap();
  S.reqs.push({id:'r'+Date.now(),kid,pool,mins});
  save();render();
}

function resReq(id,ok){
  let i=S.reqs.findIndex(r=>r.id===id);if(i<0)return;let r=S.reqs[i];
  let k=S.kids.find(x=>x.id===r.kid);
  if(ok){
    if(r.pool==='bounty'){
      fx.win();
      if(k)k.money=Number(k.money||0)+Number(r.amt||0);
      if(r.repeat==='once'){
        S.bounties=S.bounties.filter(b=>b.id!==r.bountyId);
      }
    }else{
      fx.check();
      if(k){r.pool==='daily'?k.dSpent+=r.mins:k.wSpent+=r.mins}
    }
  }else{
    fx.err();
  }
  S.reqs.splice(i,1);save();render();
}

function undoLog(logId){
  let idx=S.logs.findIndex(l=>l.id===logId);
  if(idx<0)return;
  let l=S.logs[idx];
  if(l.type==='routine'){
    let arr=S.comp[l.date]?.[l.kid];
    if(arr){
      let ti=arr.indexOf(l.taskId);
      if(ti>-1)arr.splice(ti,1);
    }
  }else if(l.type==='bounty'){
    S.reqs=S.reqs.filter(r=>!(r.pool==='bounty'&&r.kid===l.kid&&r.bountyId===l.taskId));
  }
  S.logs.splice(idx,1);
  fx.uncheck();
  save();render();
}

function payoutKid(kidId){
  let k=S.kids.find(x=>x.id===kidId);
  if(!k)return;
  if(confirm(`Pay out ${fmtMoney(k.money)} to ${k.name} and reset their pot to £0.00?`)){
    k.money=0;
    fx.coin();
    save();render();
  }
}

function cloudBadge(){
  if(U.cloud==='online')return`<span class="text-xs text-lime-400 font-bold">● LIVE SYNC</span>`;
  if(U.cloud==='error')return`<span class="text-xs text-red-400 font-bold">● SYNC ERR</span>`;
  return`<span class="text-xs text-yellow-300 font-bold">● SYNCING...</span>`;
}

function renderTaskCard(k,t,doneList){
  let ok=doneList.includes(t.id);
  let bonusBadge=(t.sched==='weekend'&&Number(t.wMins)>0)?`<span class="text-yellow-300 font-bold text-xs ml-2">+${t.wMins}M BANK</span>`:'';
  return`<div onclick="togTask('${k.id}','${t.id}')" class="box p-3 flex justify-between items-center cursor-pointer ${ok?'border-lime-400 opacity-75':''}">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 shrink-0 border-2 ${ok?'border-lime-400 bg-lime-400 text-black':'border-slate-500 bg-black'} flex items-center justify-center font-black">${ok?'✓':''}</div>
      <div class="${ok?'line-through text-slate-400':''}">${t.req?'<span class="bg-pink-600 text-xs font-bold px-1 mr-1">[REQ]</span>':''}${t.title}</div>
    </div>
    ${bonusBadge}
  </div>`;
}

function render(){
  sync();let d=curD(),dn=dName(d),isW=isWknd(dn),app=document.getElementById('app');
  let bannerHtml=U.banner?`<div class="toast fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-yellow-300 text-black font-black text-xs px-4 py-3 border-4 border-black shadow-lg text-center max-w-sm">${U.banner}</div>`:'';

  if(U.scr==='sel'){
    app.innerHTML=`${bannerHtml}
    <div class="text-center my-4">
      <div class="flex justify-center items-center gap-2 mb-1">
        <span class="bg-pink-600 text-xs font-bold px-2 py-1 border-2 border-black">${dn.toUpperCase()} // ${d} (${isW?'SAT-SUN':'MON-FRI'})</span>
        ${cloudBadge()}
      </div>
      <h1 class="text-3xl font-black text-cyan-300 tracking-widest mt-2" style="text-shadow:3px 3px 0 #ff2a85">SIDECHORES</h1>
      <p class="text-slate-400 text-sm">SELECT PLAYER TO START</p>
    </div>
    <div class="grid gap-3 mb-6">${S.kids.map(k=>{
      let ds=dStats(k.id,d),avD=Math.max(0,ds.mins-k.dSpent);
      let avW=Math.max(0,(k.wBank+wkBonusMins(k.id,S.wkM))-k.wSpent);
      let st=streakStats(k.id,S.wkM);
      return`<button onclick="goPin('${k.id}')" class="box b-cyan p-4 flex items-center gap-4 text-left w-full">
        <span class="text-4xl bg-black p-2 border-2 border-cyan-400">${k.av}</span>
        <div class="flex-1">
          <div class="flex justify-between items-center">
            <span class="text-xl font-black">${k.name.toUpperCase()}</span>
            <span class="bg-yellow-300 text-black text-xs font-black px-2 py-0.5 border border-black">💰 ${fmtMoney(k.money)}</span>
          </div>
          <div class="text-cyan-300 text-xs mt-1">TODAY: ${ds.pct}% (${avD}m ready) | 🔥 ${st.daysHit}/5 STREAK</div>
          <div class="text-lime-400 text-xs">WEEKEND BANK: ${avW}m</div>
        </div></button>`;
    }).join('')}</div>
    <div class="text-center"><button onclick="goPin('parent')" class="btn bg-purple-600 px-5 py-3 text-sm relative">
      🕹️ GAME MASTER (PARENT) ${S.reqs.length?`<span class="bg-pink-500 px-2 py-0.5 ml-1 border border-black">${S.reqs.length}</span>`:''}
    </button></div>`;
  }
  else if(U.scr==='pin'){
    let nm=U.tgt==='parent'?'GAME MASTER':(S.kids.find(k=>k.id===U.tgt)?.name.toUpperCase()||'PLAYER');
    app.innerHTML=`<div class="box b-pink p-6 mt-6 max-w-xs mx-auto text-center">
      <div class="text-pink-400 font-bold text-sm">ENTER 4-DIGIT PIN</div>
      <div class="text-xl font-black mb-4">${nm}</div>
      <div class="flex justify-center gap-2 mb-4">${[0,1,2,3].map(i=>`<div class="w-11 h-12 bg-black border-2 ${U.err?'border-red-500':'border-cyan-400'} flex items-center justify-center text-2xl text-yellow-300 font-black">${U.pin[i]?'*':''}</div>`).join('')}</div>
      ${U.err?'<div class="text-red-400 text-xs font-bold mb-3">WRONG PIN! TRY AGAIN</div>':''}
      <div class="grid grid-cols-3 gap-2">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="hitPin('${n}')" class="btn bg-slate-800 py-3 text-lg">${n}</button>`).join('')}
      <button onclick="fx.tap();U.pin='';U.err=false;render()" class="btn bg-red-600 py-3 text-xs">CLR</button>
      <button onclick="hitPin('0')" class="btn bg-slate-800 py-3 text-lg">0</button>
      <button onclick="fx.tap();U.scr='sel';render()" class="btn bg-slate-600 py-3 text-xs">EXIT</button></div></div>`;
  }
  else if(U.scr==='kid'){
    let k=S.kids.find(x=>x.id===U.kid);if(!k){U.scr='sel';return render();}
    let ds=dStats(k.id,d),ws=wkStats(k.id,S.wkM),wbm=wkBonusMins(k.id,S.wkM),st=streakStats(k.id,S.wkM);
    let avD=Math.max(0,ds.mins-k.dSpent),avW=Math.max(0,(k.wBank+wbm)-k.wSpent);
    let sched=isW?'weekend':'weekday';
    let ts=kTasks(k.id,sched),bList=kBounties(k.id),myR=S.reqs.filter(r=>r.kid===k.id);
    let catList=CATS[sched];
    app.innerHTML=`${bannerHtml}
    <div class="flex justify-between items-center mb-4">
      <div class="flex items-center gap-3"><span class="text-3xl bg-black p-2 border-2 border-cyan-400">${k.av}</span>
      <div><div class="font-black text-cyan-300 text-lg">${k.name.toUpperCase()}</div><div class="text-xs text-slate-400">${dn.toUpperCase()} // ${d} ${cloudBadge()}</div></div></div>
      <button onclick="fx.tap();U.scr='sel';render()" class="btn bg-slate-700 px-3 py-2 text-xs">LOGOUT</button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="box b-yel p-3">
        <div class="text-xs text-yellow-300 font-bold">💰 POCKET MONEY</div>
        <div class="text-2xl font-black text-white mt-1">${fmtMoney(k.money)}</div>
        <div class="text-xs text-slate-400 mt-0.5">Paid weekly by parent</div>
      </div>
      <div class="box b-pink p-3">
        <div class="flex justify-between text-xs font-bold text-pink-400">
          <span>🔥 5-DAY STREAK</span>
          <span>${st.daysHit}/5</span>
        </div>
        <div class="grid grid-cols-5 gap-1 my-2">
          ${st.dayStatus.map(x=>`<div class="text-center text-xs font-black py-1 border border-black ${x.hit?'bg-pink-500 text-white':'bg-black text-slate-500'}">${x.day[0]}</div>`).join('')}
        </div>
        <div class="text-xs text-yellow-300 font-bold">${k.streakPaidWk===S.wkM?'✅ BONUS EARNED!':'5/5 = +'+fmtMoney(S.streakBonus)}</div>
      </div>
    </div>

    <div class="box b-cyan p-3 mb-4">
      <div class="flex justify-between text-xs font-bold mb-1"><span class="text-cyan-300">⚡ DAILY ENERGY (${isW?'SAT-SUN':'MON-FRI'})</span><span class="text-yellow-300">${avD} MINS READY</span></div>
      ${bar(avD,'c-on')}
      <div class="flex justify-between text-xs text-slate-300 mt-2"><span>TODAY: <b>${ds.pct}%</b></span><span>50%=15m | 75%=30m | 100%=60m</span></div>
      ${ds.miss?'<div class="mt-2 bg-red-950 border border-red-500 p-1.5 text-xs text-red-300">⚠️ FINISH ALL <b>[REQ]</b> QUESTS TO UNLOCK ENERGY!</div>':''}
      <div class="mt-2 pt-2 border-t border-slate-700 flex justify-between items-center">
        <span class="text-xs text-slate-400">USE TODAY:</span>
        <div class="flex gap-1.5">${[15,30,60].map(m=>`<button onclick="reqTime('${k.id}','daily',${m})" ${avD<m?'disabled':''} class="btn text-xs px-2 py-1.5 ${avD>=m?'bg-cyan-400 text-black':'bg-slate-800 text-slate-600'}">-${m}M</button>`).join('')}</div>
      </div>
    </div>

    <div class="box b-lime p-3 mb-4">
      <div class="flex justify-between text-xs font-bold mb-1"><span class="text-lime-400">🔋 WEEKEND BANK</span><span class="text-yellow-300">${isW?avW+' MINS READY':'UNLOCKS SAT'}</span></div>
      ${bar(isW?avW:ws.mins,'w-on')}
      <div class="flex justify-between text-xs text-slate-300 mt-2"><span>MON-FRI: <b>${ws.pct}%</b> (${ws.c}/${ws.tot})</span><span>BONUS: <b>+${ws.mins}m</b></span></div>
      ${isW?`<div class="mt-2 pt-2 border-t border-slate-700 flex justify-between items-center"><span class="text-xs text-lime-300">USE WEEKEND:</span>
        <div class="flex gap-1.5">${[15,30,60].map(m=>`<button onclick="reqTime('${k.id}','weekend',${m})" ${avW<m?'disabled':''} class="btn text-xs px-2 py-1.5 ${avW>=m?'bg-lime-400 text-black':'bg-slate-800 text-slate-600'}">-${m}M</button>`).join('')}</div></div>`:''}
    </div>

    ${myR.length?`<div class="box b-yel p-2.5 mb-4 text-xs"><div class="text-yellow-300 font-bold mb-1">⏳ WAITING FOR PARENT APPROVAL:</div>${myR.map(r=>`<div>• ${r.pool==='bounty'?`💰 ${r.title} (${fmtMoney(r.amt)})`:`${r.mins}m screen time (${r.pool})`}</div>`).join('')}</div>`:''}

    <div class="space-y-5 mb-6">
      ${catList.map(c=>{
        let cTasks=ts.filter(t=>t.cat===c.id);
        return`<div>
          <div class="font-black ${isW?'text-lime-400':'text-cyan-300'} text-sm mb-2 flex justify-between items-center">
            <span>${c.lb}</span>
            <span class="text-xs text-slate-400">${cTasks.filter(t=>ds.done.includes(t.id)).length}/${cTasks.length}</span>
          </div>
          ${cTasks.length?`<div class="space-y-2">${cTasks.map(t=>renderTaskCard(k,t,ds.done)).join('')}</div>`:`<div class="text-xs text-slate-500 italic p-2 border border-dashed border-slate-700">No quests assigned</div>`}
        </div>`;
      }).join('')}
    </div>

    ${bList.length?`
      <div class="pt-4 border-t-2 border-slate-800">
        <div class="font-black text-yellow-300 text-sm mb-2">💰 POCKET MONEY BOUNTIES (EXTRA JOBS)</div>
        <div class="space-y-2">
          ${bList.map(b=>{
            let pending=myR.some(r=>r.pool==='bounty'&&r.bountyId===b.id);
            return`<div class="box b-yel p-3 flex justify-between items-center">
              <div>
                <div class="font-bold text-sm">${b.title}</div>
                <div class="text-xs text-yellow-300 font-bold">${fmtMoney(b.amt)} <span class="text-slate-400 font-normal">(${b.repeat==='once'?'One-off':'Repeatable'})</span></div>
              </div>
              ${pending
                ?`<span class="bg-slate-800 text-yellow-300 text-xs font-bold px-2 py-1.5 border border-yellow-400">⏳ PENDING</span>`
                :`<button onclick="claimBounty('${k.id}','${b.id}')" class="btn bg-yellow-300 text-black px-3 py-1.5 text-xs">CLAIM 💰</button>`}
            </div>`;
          }).join('')}
        </div>
      </div>
    `:''}`;
  }
  else if(U.scr==='par'){
    let mk=S.kids.find(x=>x.id===U.mKid)||S.kids[0];
    app.innerHTML=`${bannerHtml}
    <div class="flex justify-between items-center mb-4">
      <div><div class="font-black text-purple-400">🕹️ GAME MASTER</div><div class="text-xs text-slate-400">${dn.toUpperCase()} // ${d} ${cloudBadge()}</div></div>
      <button onclick="fx.tap();U.scr='sel';render()" class="btn bg-slate-700 px-3 py-2 text-xs">EXIT</button>
    </div>

    ${S.reqs.length?`<div class="box b-pink p-3 mb-4"><div class="text-pink-400 font-bold text-xs mb-2">🔔 APPROVALS (${S.reqs.length})</div>${S.reqs.map(r=>{
      let kn=S.kids.find(x=>x.id===r.kid)?.name||'Kid';
      let desc=r.pool==='bounty'?`💰 <b>${r.title}</b> (${fmtMoney(r.amt)})`:`⏱️ ${r.mins}m (${r.pool})`;
      return`<div class="bg-black p-2 mb-1 flex justify-between items-center text-xs"><span><b>${kn}</b>: ${desc}</span>
      <div class="flex gap-1.5 shrink-0 ml-2"><button onclick="resReq('${r.id}',true)" class="btn bg-lime-400 text-black px-2 py-1 text-xs">OK</button>
      <button onclick="resReq('${r.id}',false)" class="btn bg-red-600 px-2 py-1 text-xs">NO</button></div></div>`}).join('')}</div>`:''}

    <div class="grid grid-cols-5 gap-1 mb-4">${[['mat','WEEK'],['qst','QUESTS'],['ply','KIDS'],['log','UNDO'],['sys','SYSTEM']].map(([id,lb])=>`
      <button onclick="fx.tap();U.tab='${id}';render()" class="btn py-2 text-xs ${U.tab===id?'bg-cyan-400 text-black':'bg-slate-800'}">${lb}</button>`).join('')}</div>

    ${U.tab==='mat'&&mk?(()=>{
      let ws=wkStats(mk.id,S.wkM),st=streakStats(mk.id,S.wkM),mfTasks=kTasks(mk.id,'weekday'),ssTasks=kTasks(mk.id,'weekend');
      let mfDays=ws.wd.slice(0,5),ssDays=ws.wd.slice(5,7);
      return`<div class="box p-3 space-y-4">
        <div class="flex gap-2">${S.kids.map(c=>`<button onclick="fx.tap();U.mKid='${c.id}';render()" class="btn px-2 py-1 text-xs ${mk.id===c.id?'bg-yellow-300 text-black':'bg-slate-800'}">${c.av} ${c.name}</button>`).join('')}</div>
        <div class="text-xs bg-black p-2 grid grid-cols-3 gap-1 text-center">
          <div>MON-FRI: <b class="text-lime-400">${ws.pct}%</b></div>
          <div>STREAK: <b class="text-pink-400">${st.daysHit}/5</b></div>
          <div>POT: <b class="text-yellow-300">${fmtMoney(mk.money)}</b></div>
        </div>
        <div>
          <div class="text-xs font-bold text-cyan-300 mb-1">MON - FRI QUESTS</div>
          <table class="w-full text-xs"><thead><tr class="border-b border-slate-700 text-cyan-300"><th class="text-left py-1">QUEST</th>${mfDays.map(x=>`<th>${dName(x)}</th>`).join('')}</tr></thead>
          <tbody>${mfTasks.map(t=>`<tr class="border-b border-slate-800"><td class="py-1.5"><span class="text-slate-500">[${CAT_LABELS[t.cat]?.slice(0,3).toUpperCase()}]</span> ${t.req?'<b class="text-pink-400">[R]</b> ':''}${t.title}</td>${mfDays.map(x=>{
            let ok=(S.comp[x]?.[mk.id]||[]).includes(t.id);return`<td class="text-center font-bold">${ok?'<span class="text-lime-400">✓</span>':(x>d?'·':'<span class="text-red-500">✗</span>')}</td>`}).join('')}</tr>`).join('')}</tbody></table>
        </div>
        <div>
          <div class="text-xs font-bold text-lime-400 mb-1">SAT - SUN QUESTS</div>
          <table class="w-full text-xs"><thead><tr class="border-b border-slate-700 text-lime-400"><th class="text-left py-1">QUEST</th>${ssDays.map(x=>`<th>${dName(x)}</th>`).join('')}</tr></thead>
          <tbody>${ssTasks.map(t=>`<tr class="border-b border-slate-800"><td class="py-1.5"><span class="text-slate-500">[${CAT_LABELS[t.cat]?.slice(0,3).toUpperCase()}]</span> ${t.req?'<b class="text-pink-400">[R]</b> ':''}${t.title}</td>${ssDays.map(x=>{
            let ok=(S.comp[x]?.[mk.id]||[]).includes(t.id);return`<td class="text-center font-bold">${ok?'<span class="text-lime-400">✓</span>':(x>d?'·':'<span class="text-red-500">✗</span>')}</td>`}).join('')}</tr>`).join('')}</tbody></table>
        </div>
      </div>`})():''}

    ${U.tab==='qst'?`
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button type="button" onclick="fx.tap();U.qType='routine';render()" class="btn py-2 text-xs ${U.qType==='routine'?'bg-cyan-400 text-black':'bg-slate-800 text-slate-400'}">📋 ROUTINE QUESTS</button>
        <button type="button" onclick="fx.tap();U.qType='bounty';render()" class="btn py-2 text-xs ${U.qType==='bounty'?'bg-yellow-300 text-black':'bg-slate-800 text-slate-400'}">💰 POCKET MONEY JOBS</button>
      </div>

      ${U.qType==='routine'?`
        <form onsubmit="event.preventDefault();let ti=this.t.value.trim();if(!ti)return;S.tasks.push({id:'t'+Date.now(),title:ti,sched:U.qSched,cat:this.cat.value,req:this.rq.checked,wMins:U.qSched==='weekend'?Number(this.wm.value||0):0,to:this.to.value});fx.check();save();render()" class="box b-cyan p-3 mb-4 space-y-2 text-sm">
          <div class="font-bold text-cyan-300">+ NEW ROUTINE QUEST</div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="fx.tap();U.qSched='weekday';render()" class="btn py-1.5 text-xs ${U.qSched==='weekday'?'bg-cyan-400 text-black':'bg-slate-800 text-slate-400'}">MON - FRI</button>
            <button type="button" onclick="fx.tap();U.qSched='weekend';render()" class="btn py-1.5 text-xs ${U.qSched==='weekend'?'bg-lime-400 text-black':'bg-slate-800 text-slate-400'}">SAT - SUN</button>
          </div>
          <input name="t" placeholder="Quest name" required class="w-full bg-black border border-slate-600 p-2 text-white"/>
          <div class="grid grid-cols-2 gap-2">
            <select name="cat" class="bg-black border border-slate-600 p-2">
              ${CATS[U.qSched].map(c=>`<option value="${c.id}">${CAT_LABELS[c.id]}</option>`).join('')}
            </select>
            <select name="to" class="bg-black border border-slate-600 p-2"><option value="all">All Kids</option>${S.kids.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
          </div>
          <div class="flex items-center justify-between">
            <label class="text-xs text-pink-300"><input type="checkbox" name="rq"/> Essential [REQ]</label>
            ${U.qSched==='weekend'?`<label class="text-xs text-yellow-300">Extra Bank Mins: <input type="number" name="wm" value="0" min="0" step="5" class="w-16 bg-black border border-slate-600 p-1 text-white"/></label>`:''}
          </div>
          <button class="btn bg-lime-400 text-black w-full py-2 text-xs">ADD ROUTINE QUEST</button>
        </form>
        <div class="space-y-4">
          ${['weekday','weekend'].map(sc=>`
            <div>
              <div class="font-black text-xs ${sc==='weekday'?'text-cyan-300':'text-lime-400'} mb-2">${sc==='weekday'?'📅 MON - FRI QUESTS':'🌟 SAT - SUN QUESTS'}</div>
              <div class="space-y-2">${S.tasks.filter(t=>t.sched===sc).map(t=>`<div class="box p-2.5 flex justify-between items-center text-sm">
                <div>
                  <span class="bg-slate-800 text-cyan-200 text-xs px-1.5 py-0.5 mr-1 border border-slate-600">${CAT_LABELS[t.cat]||t.cat}</span>
                  ${t.req?'<span class="bg-pink-600 text-xs px-1 mr-1">[REQ]</span>':''}${t.title}
                  ${t.sched==='weekend'&&Number(t.wMins)>0?`<span class="text-xs text-yellow-300 ml-1">(+${t.wMins}m bank)</span>`:''}
                </div>
                <div class="flex gap-1">
                  <button onclick="let x=S.tasks.find(z=>z.id==='${t.id}');x.req=!x.req;fx.tap();save();render()" class="btn px-2 py-1 text-xs ${t.req?'bg-pink-600':'bg-slate-700'}">REQ</button>
                  <button onclick="S.tasks=S.tasks.filter(z=>z.id!=='${t.id}');fx.uncheck();save();render()" class="btn bg-red-600 px-2 py-1 text-xs">X</button>
                </div></div>`).join('')}</div>
            </div>
          `).join('')}
        </div>
      `:`
        <form onsubmit="event.preventDefault();let ti=this.t.value.trim(),am=parseFloat(this.amt.value);if(!ti||isNaN(am)||am<=0)return;S.bounties.push({id:'b'+Date.now(),title:ti,amt:am,repeat:this.rep.value,to:this.to.value});fx.coin();save();render()" class="box b-yel p-3 mb-4 space-y-2 text-sm">
          <div class="font-bold text-yellow-300">+ NEW POCKET MONEY JOB</div>
          <input name="t" placeholder="Job description (e.g. Wash Car)" required class="w-full bg-black border border-slate-600 p-2 text-white"/>
          <div class="grid grid-cols-3 gap-2">
            <input name="amt" type="number" step="0.25" min="0.25" value="1.50" placeholder="£ Amount" required class="bg-black border border-slate-600 p-2 text-yellow-300 font-bold"/>
            <select name="rep" class="bg-black border border-slate-600 p-2 text-xs"><option value="weekly">Repeatable</option><option value="once">One-Off</option></select>
            <select name="to" class="bg-black border border-slate-600 p-2 text-xs"><option value="all">All Kids</option>${S.kids.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
          </div>
          <button class="btn bg-yellow-300 text-black w-full py-2 text-xs">ADD POCKET MONEY JOB</button>
        </form>
        <div class="space-y-2">
          ${S.bounties.map(b=>`<div class="box b-yel p-2.5 flex justify-between items-center text-sm">
            <div>
              <span class="bg-yellow-300 text-black font-black text-xs px-1.5 py-0.5 mr-1">${fmtMoney(b.amt)}</span>
              ${b.title} <span class="text-xs text-slate-400">(${b.repeat==='once'?'One-off':'Repeatable'})</span>
            </div>
            <button onclick="S.bounties=S.bounties.filter(z=>z.id!=='${b.id}');fx.uncheck();save();render()" class="btn bg-red-600 px-2 py-1 text-xs">X</button>
          </div>`).join('')}
        </div>
      `}
    `:''}

    ${U.tab==='ply'?`
      <div class="space-y-2 mb-5">
        <div class="font-bold text-yellow-300 text-xs">💰 POCKET MONEY POTS & PROFILES</div>
        ${S.kids.map(c=>`<div class="box p-3 space-y-2">
          <div class="flex justify-between items-center">
            <div><b class="text-base">${c.av} ${c.name}</b> <span class="text-xs text-slate-400">(PIN: ${c.pin})</span></div>
            <div class="text-lg font-black text-yellow-300">${fmtMoney(c.money)}</div>
          </div>
          <div class="flex gap-1.5 justify-end">
            <button onclick="payoutKid('${c.id}')" class="btn bg-lime-400 text-black px-2.5 py-1 text-xs">PAY OUT £</button>
            <button onclick="let p=prompt('New 4-digit PIN:');if(/^\d{4}$/.test(p)){let x=S.kids.find(z=>z.id==='${c.id}');x.pin=p;fx.tap();save();render()}" class="btn bg-yellow-300 text-black px-2 py-1 text-xs">PIN</button>
            <button onclick="if(confirm('Delete ${c.name}?')){S.kids=S.kids.filter(z=>z.id!=='${c.id}');S.reqs=S.reqs.filter(r=>r.kid!=='${c.id}');save();render()}" class="btn bg-red-600 px-2 py-1 text-xs">DEL</button>
          </div>
        </div>`).join('')}
      </div>
      <form onsubmit="event.preventDefault();let n=this.n.value.trim(),p=this.p.value.trim();if(!n||!/^\d{4}$/.test(p))return alert('Need name & 4-digit PIN');S.kids.push({id:'k'+Date.now(),name:n,av:this.av.value,pin:p,dSpent:0,wBank:0,wUnl:'',wSpent:0,money:0,streakPaidWk:''});fx.check();save();render()" class="box b-lime p-3 space-y-2 text-sm">
        <div class="font-bold text-lime-400">+ ADD CHILD</div>
        <div class="grid grid-cols-3 gap-2"><input name="n" placeholder="Name" required class="col-span-2 bg-black border border-slate-600 p-2"/>
        <select name="av" class="bg-black border border-slate-600 p-2 text-center">${AV.map(a=>`<option>${a}</option>`).join('')}</select></div>
        <input name="p" value="1234" maxlength="4" placeholder="4-digit PIN" class="w-full bg-black border border-slate-600 p-2"/>
        <button class="btn bg-cyan-400 text-black w-full py-2 text-xs">SAVE CHILD</button>
      </form>
    `:''}

    ${U.tab==='log'?`
      <div class="box p-3">
        <div class="font-bold text-cyan-300 text-xs mb-2">⏪ RECENT ACTIVITY & OOPS UNDO</div>
        ${S.logs.length?`<div class="space-y-2">${S.logs.map(l=>`
          <div class="bg-black p-2 border border-slate-800 flex justify-between items-center text-xs">
            <div>
              <span class="text-slate-400">[${l.time}]</span> <b class="text-cyan-300">${l.kName}</b>: ${l.action}
            </div>
            <button onclick="undoLog('${l.id}')" class="btn bg-red-600 text-white px-2 py-1 text-xs shrink-0 ml-2">UNDO</button>
          </div>
        `).join('')}</div>`:`<div class="text-xs text-slate-500 italic">No recent activity logged yet.</div>`}
      </div>
    `:''}

    ${U.tab==='sys'?`<div class="space-y-3 text-sm">
      <div class="box b-pink p-3">
        <div class="font-bold text-pink-400 mb-1">🔥 5-DAY STREAK POCKET MONEY BONUS: ${fmtMoney(S.streakBonus)}</div>
        <p class="text-xs text-slate-300 mb-2">Awarded automatically when a child completes 100% of Mon–Fri quests all 5 weekdays.</p>
        <div class="flex gap-2">
          <input id="sbInp" type="number" step="0.50" min="0" value="${Number(S.streakBonus).toFixed(2)}" class="w-24 bg-black border border-slate-600 p-2 text-yellow-300 font-bold"/>
          <button onclick="let v=parseFloat(document.getElementById('sbInp').value);if(!isNaN(v)&&v>=0){S.streakBonus=v;fx.coin();save();render()}" class="btn bg-pink-500 text-white px-3 py-2 text-xs">SAVE BONUS</button>
        </div>
      </div>
      <div class="box p-3"><div class="font-bold text-purple-400 mb-1">PARENT PIN: ${S.pPin}</div>
      <button onclick="let p=prompt('New 4-digit Parent PIN:');if(/^\d{4}$/.test(p)){S.pPin=p;fx.tap();save();render()}" class="btn bg-purple-600 px-3 py-2 text-xs">CHANGE PIN</button></div>
      <div class="box b-yel p-3"><div class="font-bold text-yellow-300 mb-1">⏩ DAY SIMULATOR (Offset: +${S.off||0}d)</div>
      <p class="text-xs text-slate-300 mb-2">Test nightly resets and Saturday auto-unlock.</p>
      <button onclick="S.off=(S.off||0)+1;fx.tap();save();render()" class="btn bg-yellow-300 text-black px-3 py-2 text-xs mr-2">NEXT DAY ⏭️</button>
      ${S.off?`<button onclick="S.off=0;fx.tap();save();render()" class="btn bg-slate-700 px-3 py-2 text-xs">TODAY</button>`:''}</div></div>`:''}`;
  }
}
render();
</script>
</body>
</html>
