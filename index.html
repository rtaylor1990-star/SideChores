<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>SideChores Arcade</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#0b0c14;--card:#151828;--cyan:#00f5d4;--pink:#ff2a85;--lime:#39ff14;--yel:#ffe600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#f8fafc;font-family:'Courier New',Courier,monospace;margin:0;padding-bottom:60px}
.box{background:var(--card);border:3px solid #334155;box-shadow:4px 4px 0 #000}
.b-cyan{border-color:var(--cyan)}.b-pink{border-color:var(--pink)}.b-lime{border-color:var(--lime)}.b-yel{border-color:var(--yel)}
.btn{font-weight:900;text-transform:uppercase;border:3px solid #000;box-shadow:3px 3px 0 #000;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.cell{height:20px;border:2px solid #000;background:#1e293b}
.c-on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.w-on{background:var(--lime);box-shadow:0 0 6px var(--lime)}
</style>
</head>
<body>
<div id="app" class="max-w-lg mx-auto p-4"></div>
<script>
window.onerror=function(m,s,l){document.getElementById('app').innerHTML='<div class="box b-pink p-4 text-red-400">ERR L'+l+': '+m+'</div>'};

const KEY='sc_arc_v6',DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],AV=['👾','🤖','🦖','🚀','⚡','🦊','🐉','🎮'];
const CATS={
  weekday:[{id:'morning',lb:'🌅 MORNING'},{id:'after_school',lb:'🎒 AFTER SCHOOL'},{id:'bedtime',lb:'🌙 BEDTIME'}],
  weekend:[{id:'morning',lb:'🌅 MORNING'},{id:'afternoon',lb:'☀️ AFTERNOON'},{id:'bedtime',lb:'🌙 BEDTIME'}]
};
const CAT_LABELS={morning:'Morning',after_school:'After School',afternoon:'Afternoon',bedtime:'Bedtime'};
const snd={c:null,p(f,d=0.07){try{if(!this.c)this.c=new(window.AudioContext||window.webkitAudioContext)();f.forEach((v,i)=>{let o=this.c.createOscillator(),g=this.c.createGain();o.type='square';o.frequency.value=v;g.gain.value=0.05;o.connect(g);g.connect(this.c.destination);o.start(this.c.currentTime+i*d);o.stop(this.c.currentTime+(i+1)*d)})}catch(e){}}};

const iso=(off=0)=>{let d=new Date();d.setDate(d.getDate()+off);return d.toISOString().split('T')[0]};
const dName=(s)=>{let p=s.split('-').map(Number);return DAYS[new Date(p[0],p[1]-1,p[2]).getDay()]};
const isWknd=(dn)=>dn==='Sat'||dn==='Sun';
const monOf=(s)=>{let p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]),day=d.getDay();d.setDate(d.getDate()-day+(day===0?-6:1));return d.toISOString().split('T')[0]};
const wkDates=(m)=>{let p=m.split('-').map(Number);return[0,1,2,3,4,5,6].map(i=>new Date(p[0],p[1]-1,p[2]+i).toISOString().split('T')[0])};
const tier=(pct,miss)=>miss?0:pct>=100?60:pct>=75?30:pct>=50?15:0;

function defState(){
  let t=iso(),m=monOf(t);
  return{pPin:'1234',off:0,lastD:t,wkM:m,
    kids:[
      {id:'k1',name:'James',av:'🚀',pin:'1234',dSpent:0,wBank:0,wUnl:'',wSpent:0},
      {id:'k2',name:'Harrison',av:'🦖',pin:'1234',dSpent:0,wBank:0,wUnl:'',wSpent:0}
    ],
    tasks:[
      {id:'t1',title:'Make Bed & Brush Teeth AM',sched:'weekday',cat:'morning',req:true,wMins:0,to:'all'},
      {id:'t2',title:'Reading / Homework 20m',sched:'weekday',cat:'after_school',req:false,wMins:0,to:'all'},
      {id:'t3',title:'Pack School Bag & Shoes',sched:'weekday',cat:'after_school',req:false,wMins:0,to:'all'},
      {id:'t4',title:'Tidy Room & Brush Teeth PM',sched:'weekday',cat:'bedtime',req:true,wMins:0,to:'all'},
      {id:'t5',title:'Make Bed & Brush Teeth AM',sched:'weekend',cat:'morning',req:true,wMins:0,to:'all'},
      {id:'t6',title:'Hoover Bedroom',sched:'weekend',cat:'afternoon',req:false,wMins:15,to:'all'},
      {id:'t7',title:'Wash Car / Tidy Garden',sched:'weekend',cat:'afternoon',req:false,wMins:20,to:'all'},
      {id:'t8',title:'Tidy Toys & Brush Teeth PM',sched:'weekend',cat:'bedtime',req:true,wMins:0,to:'all'}
    ],comp:{},reqs:[]};
}

let S=(()=>{try{let r=JSON.parse(localStorage.getItem(KEY));return(r&&r.kids)?r:defState()}catch(e){return defState()}})();
let U={scr:'sel',tgt:null,pin:'',err:false,kid:null,tab:'mat',mKid:S.kids[0]?.id||'k1',qSched:'weekday'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const curD=()=>iso(S.off||0);

function sync(){
  let d=curD(),m=monOf(d),dn=dName(d);
  if(S.wkM!==m){S.wkM=m;S.kids.forEach(k=>{k.wBank=0;k.wSpent=0;k.wUnl=''})}
  if(S.lastD!==d){S.lastD=d;S.kids.forEach(k=>k.dSpent=0);S.reqs=S.reqs.filter(r=>r.pool!=='daily')}
  if(isWknd(dn)){
    S.kids.forEach(k=>{if(k.wUnl!==m){k.wBank=wkStats(k.id,m).mins;k.wUnl=m}});
  }
  save();
}

const kTasks=(kid,sched)=>S.tasks.filter(t=>t.sched===sched&&(t.to==='all'||t.to===kid));

function dStats(kid,d){
  let sched=isWknd(dName(d))?'weekend':'weekday';
  let ts=kTasks(kid,sched),done=(S.comp[d]?.[kid])||[];
  let c=ts.filter(t=>done.includes(t.id)).length,pct=ts.length?Math.round(c/ts.length*100):0;
  let miss=ts.filter(t=>t.req).some(t=>!done.includes(t.id));
  return{pct,miss,mins:tier(pct,miss),done,sched};
}

function wkStats(kid,m){
  let wd=wkDates(m),mf=wd.slice(0,5),ts=kTasks(kid,'weekday'),tot=ts.length*5,c=0;
  mf.forEach(d=>{let done=(S.comp[d]?.[kid])||[];c+=ts.filter(t=>done.includes(t.id)).length});
  let pct=tot?Math.round(c/tot*100):0;
  return{pct,c,tot,mins:tier(pct,false),wd};
}

function wkBonusMins(kid,m){
  let wd=wkDates(m),ss=[wd[5],wd[6]],ts=kTasks(kid,'weekend'),mins=0;
  ss.forEach(d=>{let done=(S.comp[d]?.[kid])||[];ts.forEach(t=>{if(done.includes(t.id)&&Number(t.wMins||0)>0)mins+=Number(t.wMins)})});
  return mins;
}

const bar=(av,cls)=>{let h='';for(let i=0;i<12;i++)h+=`<div class="cell ${i<Math.floor(av/5)?cls:''}"></div>`;return`<div class="grid grid-cols-12 gap-1 p-1 bg-black border-2 border-slate-700">${h}</div>`};

function goPin(t){snd.p([600]);U={...U,scr:'pin',tgt:t,pin:'',err:false};render()}
function hitPin(n){
  snd.p([600]);if(U.pin.length>=4)return;U.pin+=n;
  if(U.pin.length===4){
    let exp=U.tgt==='parent'?S.pPin:(S.kids.find(k=>k.id===U.tgt)?.pin||'1234');
    if(U.pin===exp){snd.p([440,660,880]);U.scr=U.tgt==='parent'?'par':'kid';U.kid=U.tgt;U.pin=''}
    else{snd.p([180,120]);U.err=true;U.pin=''}
  }render();
}
function togTask(kid,tid){
  let d=curD();if(!S.comp[d])S.comp[d]={};if(!S.comp[d][kid])S.comp[d][kid]=[];
  let a=S.comp[d][kid],i=a.indexOf(tid);
  if(i>-1){a.splice(i,1);snd.p([400])}else{a.push(tid);snd.p([980,1318])}
  save();render();
}
function reqTime(kid,pool,mins){snd.p([500,700]);S.reqs.push({id:'r'+Date.now(),kid,pool,mins});save();render()}
function resReq(id,ok){
  let i=S.reqs.findIndex(r=>r.id===id);if(i<0)return;let r=S.reqs[i];
  if(ok){snd.p([500,800]);let k=S.kids.find(x=>x.id===r.kid);if(k){r.pool==='daily'?k.dSpent+=r.mins:k.wSpent+=r.mins}}
  else snd.p([200,140]);
  S.reqs.splice(i,1);save();render();
}

function renderTaskCard(k,t,doneList){
  let ok=doneList.includes(t.id);
  let bonusBadge=(t.sched==='weekend'&&Number(t.wMins)>0)?`<span class="text-yellow-300 font-bold text-xs ml-2">+${t.wMins}M BANK</span>`:'';
  return`<div onclick="togTask('${k.id}','${t.id}')" class="box p-3 flex justify-between items-center cursor-pointer ${ok?'border-lime-400 opacity-75':''}">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 shrink-0 border-2 ${ok?'border-lime-400 bg-lime-400 text-black':'border-slate-500 bg-black'} flex items-center justify-center font-black">${ok?'✓':''}</div>
      <div class="${ok?'line-through text-slate-400':''}">${t.req?'<span class="bg-pink-600 text-xs font-bold px-1 mr-1">[REQ]</span>':''}${t.title}</div>
    </div>
    ${bonusBadge}
  </div>`;
}

function render(){
  sync();let d=curD(),dn=dName(d),isW=isWknd(dn),app=document.getElementById('app');
  if(U.scr==='sel'){
    app.innerHTML=`
    <div class="text-center my-4">
      <span class="bg-pink-600 text-xs font-bold px-2 py-1 border-2 border-black">${dn.toUpperCase()} // ${d} (${isW?'SAT-SUN':'MON-FRI'})</span>
      <h1 class="text-3xl font-black text-cyan-300 tracking-widest mt-2" style="text-shadow:3px 3px 0 #ff2a85">SIDECHORES</h1>
      <p class="text-slate-400 text-sm">SELECT PLAYER TO START</p>
    </div>
    <div class="grid gap-3 mb-6">${S.kids.map(k=>{
      let ds=dStats(k.id,d),avD=Math.max(0,ds.mins-k.dSpent);
      let avW=Math.max(0,(k.wBank+wkBonusMins(k.id,S.wkM))-k.wSpent);
      return`<button onclick="goPin('${k.id}')" class="box b-cyan p-4 flex items-center gap-4 text-left w-full">
        <span class="text-4xl bg-black p-2 border-2 border-cyan-400">${k.av}</span>
        <div><div class="text-xl font-black">${k.name.toUpperCase()}</div>
        <div class="text-cyan-300 text-sm">TODAY (${isW?'SAT-SUN':'MON-FRI'}): ${ds.pct}% (${avD}m ready)</div>
        <div class="text-lime-400 text-sm">WEEKEND BANK: ${avW}m</div></div></button>`;
    }).join('')}</div>
    <div class="text-center"><button onclick="goPin('parent')" class="btn bg-purple-600 px-5 py-3 text-sm relative">
      🕹️ GAME MASTER (PARENT) ${S.reqs.length?`<span class="bg-pink-500 px-2 py-0.5 ml-1 border border-black">${S.reqs.length}</span>`:''}
    </button></div>`;
  }
  else if(U.scr==='pin'){
    let nm=U.tgt==='parent'?'GAME MASTER':(S.kids.find(k=>k.id===U.tgt)?.name.toUpperCase()||'PLAYER');
    app.innerHTML=`<div class="box b-pink p-6 mt-6 max-w-xs mx-auto text-center">
      <div class="text-pink-400 font-bold text-sm">ENTER 4-DIGIT PIN</div>
      <div class="text-xl font-black mb-4">${nm}</div>
      <div class="flex justify-center gap-2 mb-4">${[0,1,2,3].map(i=>`<div class="w-11 h-12 bg-black border-2 ${U.err?'border-red-500':'border-cyan-400'} flex items-center justify-center text-2xl text-yellow-300 font-black">${U.pin[i]?'*':''}</div>`).join('')}</div>
      ${U.err?'<div class="text-red-400 text-xs font-bold mb-3">WRONG PIN! TRY AGAIN</div>':''}
      <div class="grid grid-cols-3 gap-2">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="hitPin('${n}')" class="btn bg-slate-800 py-3 text-lg">${n}</button>`).join('')}
      <button onclick="U.pin='';U.err=false;render()" class="btn bg-red-600 py-3 text-xs">CLR</button>
      <button onclick="hitPin('0')" class="btn bg-slate-800 py-3 text-lg">0</button>
      <button onclick="U.scr='sel';render()" class="btn bg-slate-600 py-3 text-xs">EXIT</button></div></div>`;
  }
  else if(U.scr==='kid'){
    let k=S.kids.find(x=>x.id===U.kid);if(!k){U.scr='sel';return render();}
    let ds=dStats(k.id,d),ws=wkStats(k.id,S.wkM),wbm=wkBonusMins(k.id,S.wkM);
    let avD=Math.max(0,ds.mins-k.dSpent),avW=Math.max(0,(k.wBank+wbm)-k.wSpent);
    let sched=isW?'weekend':'weekday';
    let ts=kTasks(k.id,sched),myR=S.reqs.filter(r=>r.kid===k.id);
    let catList=CATS[sched];
    app.innerHTML=`
    <div class="flex justify-between items-center mb-4">
      <div class="flex items-center gap-3"><span class="text-3xl bg-black p-2 border-2 border-cyan-400">${k.av}</span>
      <div><div class="font-black text-cyan-300 text-lg">${k.name.toUpperCase()}</div><div class="text-xs text-slate-400">${dn.toUpperCase()} // ${d}</div></div></div>
      <button onclick="U.scr='sel';render()" class="btn bg-slate-700 px-3 py-2 text-xs">LOGOUT</button>
    </div>
    <div class="box b-cyan p-3 mb-4">
      <div class="flex justify-between text-xs font-bold mb-1"><span class="text-cyan-300">⚡ DAILY ENERGY (${isW?'SAT-SUN':'MON-FRI'})</span><span class="text-yellow-300">${avD} MINS READY</span></div>
      ${bar(avD,'c-on')}
      <div class="flex justify-between text-xs text-slate-300 mt-2"><span>TODAY: <b>${ds.pct}%</b></span><span>50%=15m | 75%=30m | 100%=60m</span></div>
      ${ds.miss?'<div class="mt-2 bg-red-950 border border-red-500 p-1.5 text-xs text-red-300">⚠️ FINISH ALL <b>[REQ]</b> QUESTS TO UNLOCK ENERGY!</div>':''}
      <div class="mt-2 pt-2 border-t border-slate-700 flex justify-between items-center">
        <span class="text-xs text-slate-400">USE TODAY:</span>
        <div class="flex gap-1.5">${[15,30,60].map(m=>`<button onclick="reqTime('${k.id}','daily',${m})" ${avD<m?'disabled':''} class="btn text-xs px-2 py-1.5 ${avD>=m?'bg-cyan-400 text-black':'bg-slate-800 text-slate-600'}">-${m}M</button>`).join('')}</div>
      </div>
    </div>
    <div class="box b-lime p-3 mb-4">
      <div class="flex justify-between text-xs font-bold mb-1"><span class="text-lime-400">🔋 WEEKEND BANK</span><span class="text-yellow-300">${isW?avW+' MINS READY':'UNLOCKS SAT'}</span></div>
      ${bar(isW?avW:ws.mins,'w-on')}
      <div class="flex justify-between text-xs text-slate-300 mt-2"><span>MON-FRI: <b>${ws.pct}%</b> (${ws.c}/${ws.tot})</span><span>BONUS: <b>+${ws.mins}m</b></span></div>
      ${isW?`<div class="mt-2 pt-2 border-t border-slate-700 flex justify-between items-center"><span class="text-xs text-lime-300">USE WEEKEND:</span>
        <div class="flex gap-1.5">${[15,30,60].map(m=>`<button onclick="reqTime('${k.id}','weekend',${m})" ${avW<m?'disabled':''} class="btn text-xs px-2 py-1.5 ${avW>=m?'bg-lime-400 text-black':'bg-slate-800 text-slate-600'}">-${m}M</button>`).join('')}</div></div>`:''}
    </div>
    ${myR.length?`<div class="box b-yel p-2.5 mb-4 text-xs"><div class="text-yellow-300 font-bold">⏳ WAITING FOR PARENT:</div>${myR.map(r=>`<div>• ${r.mins}m (${r.pool})</div>`).join('')}</div>`:''}
    <div class="space-y-5">
      ${catList.map(c=>{
        let cTasks=ts.filter(t=>t.cat===c.id);
        return`<div>
          <div class="font-black ${isW?'text-lime-400':'text-cyan-300'} text-sm mb-2 flex justify-between items-center">
            <span>${c.lb}</span>
            <span class="text-xs text-slate-400">${cTasks.filter(t=>ds.done.includes(t.id)).length}/${cTasks.length}</span>
          </div>
          ${cTasks.length?`<div class="space-y-2">${cTasks.map(t=>renderTaskCard(k,t,ds.done)).join('')}</div>`:`<div class="text-xs text-slate-500 italic p-2 border border-dashed border-slate-700">No quests assigned</div>`}
        </div>`;
      }).join('')}
    </div>`;
  }
  else if(U.scr==='par'){
    let mk=S.kids.find(x=>x.id===U.mKid)||S.kids[0];
    app.innerHTML=`
    <div class="flex justify-between items-center mb-4">
      <div><div class="font-black text-purple-400">🕹️ GAME MASTER</div><div class="text-xs text-slate-400">${dn.toUpperCase()} // ${d}</div></div>
      <button onclick="U.scr='sel';render()" class="btn bg-slate-700 px-3 py-2 text-xs">EXIT</button>
    </div>
    ${S.reqs.length?`<div class="box b-pink p-3 mb-4"><div class="text-pink-400 font-bold text-xs mb-2">🔔 APPROVALS</div>${S.reqs.map(r=>{
      let kn=S.kids.find(x=>x.id===r.kid)?.name||'Kid';
      return`<div class="bg-black p-2 mb-1 flex justify-between items-center text-sm"><span><b>${kn}</b>: ${r.mins}m (${r.pool})</span>
      <div class="flex gap-1.5"><button onclick="resReq('${r.id}',true)" class="btn bg-lime-400 text-black px-2 py-1 text-xs">OK</button>
      <button onclick="resReq('${r.id}',false)" class="btn bg-red-600 px-2 py-1 text-xs">NO</button></div></div>`}).join('')}</div>`:''}
    <div class="grid grid-cols-4 gap-1 mb-4">${[['mat','WEEK'],['qst','QUESTS'],['ply','KIDS'],['sys','SYSTEM']].map(([id,lb])=>`
      <button onclick="U.tab='${id}';render()" class="btn py-2 text-xs ${U.tab===id?'bg-cyan-400 text-black':'bg-slate-800'}">${lb}</button>`).join('')}</div>
    ${U.tab==='mat'&&mk?(()=>{
      let ws=wkStats(mk.id,S.wkM),mfTasks=kTasks(mk.id,'weekday'),ssTasks=kTasks(mk.id,'weekend');
      let mfDays=ws.wd.slice(0,5),ssDays=ws.wd.slice(5,7);
      return`<div class="box p-3 space-y-4">
        <div class="flex gap-2">${S.kids.map(c=>`<button onclick="U.mKid='${c.id}';render()" class="btn px-2 py-1 text-xs ${mk.id===c.id?'bg-yellow-300 text-black':'bg-slate-800'}">${c.av} ${c.name}</button>`).join('')}</div>
        <div class="text-xs bg-black p-2 flex justify-between"><span>MON-FRI: <b class="text-lime-400">${ws.pct}%</b></span><span>WKND BONUS: <b class="text-yellow-300">${ws.mins}m</b></span></div>
        <div>
          <div class="text-xs font-bold text-cyan-300 mb-1">MON - FRI QUESTS</div>
          <table class="w-full text-xs"><thead><tr class="border-b border-slate-700 text-cyan-300"><th class="text-left py-1">QUEST</th>${mfDays.map(x=>`<th>${dName(x)}</th>`).join('')}</tr></thead>
          <tbody>${mfTasks.map(t=>`<tr class="border-b border-slate-800"><td class="py-1.5"><span class="text-slate-500">[${CAT_LABELS[t.cat]?.slice(0,3).toUpperCase()}]</span> ${t.req?'<b class="text-pink-400">[R]</b> ':''}${t.title}</td>${mfDays.map(x=>{
            let ok=(S.comp[x]?.[mk.id]||[]).includes(t.id);return`<td class="text-center font-bold">${ok?'<span class="text-lime-400">✓</span>':(x>d?'·':'<span class="text-red-500">✗</span>')}</td>`}).join('')}</tr>`).join('')}</tbody></table>
        </div>
        <div>
          <div class="text-xs font-bold text-lime-400 mb-1">SAT - SUN QUESTS</div>
          <table class="w-full text-xs"><thead><tr class="border-b border-slate-700 text-lime-400"><th class="text-left py-1">QUEST</th>${ssDays.map(x=>`<th>${dName(x)}</th>`).join('')}</tr></thead>
          <tbody>${ssTasks.map(t=>`<tr class="border-b border-slate-800"><td class="py-1.5"><span class="text-slate-500">[${CAT_LABELS[t.cat]?.slice(0,3).toUpperCase()}]</span> ${t.req?'<b class="text-pink-400">[R]</b> ':''}${t.title}</td>${ssDays.map(x=>{
            let ok=(S.comp[x]?.[mk.id]||[]).includes(t.id);return`<td class="text-center font-bold">${ok?'<span class="text-lime-400">✓</span>':(x>d?'·':'<span class="text-red-500">✗</span>')}</td>`}).join('')}</tr>`).join('')}</tbody></table>
        </div>
      </div>`})():''}
    ${U.tab==='qst'?`
      <form onsubmit="event.preventDefault();let ti=this.t.value.trim();if(!ti)return;S.tasks.push({id:'t'+Date.now(),title:ti,sched:U.qSched,cat:this.cat.value,req:this.rq.checked,wMins:U.qSched==='weekend'?Number(this.wm.value||0):0,to:this.to.value});save();render()" class="box b-cyan p-3 mb-4 space-y-2 text-sm">
        <div class="font-bold text-cyan-300">+ NEW QUEST</div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="U.qSched='weekday';render()" class="btn py-1.5 text-xs ${U.qSched==='weekday'?'bg-cyan-400 text-black':'bg-slate-800 text-slate-400'}">MON - FRI</button>
          <button type="button" onclick="U.qSched='weekend';render()" class="btn py-1.5 text-xs ${U.qSched==='weekend'?'bg-lime-400 text-black':'bg-slate-800 text-slate-400'}">SAT - SUN</button>
        </div>
        <input name="t" placeholder="Quest name" required class="w-full bg-black border border-slate-600 p-2 text-white"/>
        <div class="grid grid-cols-2 gap-2">
          <select name="cat" class="bg-black border border-slate-600 p-2">
            ${CATS[U.qSched].map(c=>`<option value="${c.id}">${CAT_LABELS[c.id]}</option>`).join('')}
          </select>
          <select name="to" class="bg-black border border-slate-600 p-2"><option value="all">All Kids</option>${S.kids.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
        </div>
        <div class="flex items-center justify-between">
          <label class="text-xs text-pink-300"><input type="checkbox" name="rq"/> Essential [REQ]</label>
          ${U.qSched==='weekend'?`<label class="text-xs text-yellow-300">Extra Bank Mins: <input type="number" name="wm" value="0" min="0" step="5" class="w-16 bg-black border border-slate-600 p-1 text-white"/></label>`:''}
        </div>
        <button class="btn bg-lime-400 text-black w-full py-2 text-xs">ADD QUEST</button>
      </form>
      <div class="space-y-4">
        ${['weekday','weekend'].map(sc=>`
          <div>
            <div class="font-black text-xs ${sc==='weekday'?'text-cyan-300':'text-lime-400'} mb-2">${sc==='weekday'?'📅 MON - FRI QUESTS':'🌟 SAT - SUN QUESTS'}</div>
            <div class="space-y-2">${S.tasks.filter(t=>t.sched===sc).map(t=>`<div class="box p-2.5 flex justify-between items-center text-sm">
              <div>
                <span class="bg-slate-800 text-cyan-200 text-xs px-1.5 py-0.5 mr-1 border border-slate-600">${CAT_LABELS[t.cat]||t.cat}</span>
                ${t.req?'<span class="bg-pink-600 text-xs px-1 mr-1">[REQ]</span>':''}${t.title}
                ${t.sched==='weekend'&&Number(t.wMins)>0?`<span class="text-xs text-yellow-300 ml-1">(+${t.wMins}m bank)</span>`:''}
              </div>
              <div class="flex gap-1">
                <button onclick="let x=S.tasks.find(z=>z.id==='${t.id}');x.req=!x.req;save();render()" class="btn px-2 py-1 text-xs ${t.req?'bg-pink-600':'bg-slate-700'}">REQ</button>
                <button onclick="S.tasks=S.tasks.filter(z=>z.id!=='${t.id}');save();render()" class="btn bg-red-600 px-2 py-1 text-xs">X</button>
              </div></div>`).join('')}</div>
          </div>
        `).join('')}
      </div>`:''}
    ${U.tab==='ply'?`<form onsubmit="event.preventDefault();let n=this.n.value.trim(),p=this.p.value.trim();if(!n||!/^\d{4}$/.test(p))return alert('Need name & 4-digit PIN');S.kids.push({id:'k'+Date.now(),name:n,av:this.av.value,pin:p,dSpent:0,wBank:0,wUnl:'',wSpent:0});save();render()" class="box b-lime p-3 mb-4 space-y-2 text-sm">
      <div class="font-bold text-lime-400">+ ADD CHILD</div>
      <div class="grid grid-cols-3 gap-2"><input name="n" placeholder="Name" required class="col-span-2 bg-black border border-slate-600 p-2"/>
      <select name="av" class="bg-black border border-slate-600 p-2 text-center">${AV.map(a=>`<option>${a}</option>`).join('')}</select></div>
      <input name="p" value="1234" maxlength="4" placeholder="4-digit PIN" class="w-full bg-black border border-slate-600 p-2"/>
      <button class="btn bg-cyan-400 text-black w-full py-2 text-xs">SAVE CHILD</button></form>
      <div class="space-y-2">${S.kids.map(c=>`<div class="box p-3 flex justify-between items-center">
        <div><b>${c.av} ${c.name}</b> <span class="text-xs text-yellow-300">(PIN: ${c.pin})</span></div>
        <div class="flex gap-1.5"><button onclick="let p=prompt('New 4-digit PIN:');if(/^\d{4}$/.test(p)){let x=S.kids.find(z=>z.id==='${c.id}');x.pin=p;save();render()}" class="btn bg-yellow-300 text-black px-2 py-1 text-xs">PIN</button>
        <button onclick="if(confirm('Delete ${c.name}?')){S.kids=S.kids.filter(z=>z.id!=='${c.id}');S.reqs=S.reqs.filter(r=>r.kid!=='${c.id}');save();render()}" class="btn bg-red-600 px-2 py-1 text-xs">DEL</button></div></div>`).join('')}</div>`:''}
    ${U.tab==='sys'?`<div class="space-y-3 text-sm">
      <div class="box p-3"><div class="font-bold text-purple-400 mb-1">PARENT PIN: ${S.pPin}</div>
      <button onclick="let p=prompt('New 4-digit Parent PIN:');if(/^\d{4}$/.test(p)){S.pPin=p;save();render()}" class="btn bg-purple-600 px-3 py-2 text-xs">CHANGE PIN</button></div>
      <div class="box b-yel p-3"><div class="font-bold text-yellow-300 mb-1">⏩ DAY SIMULATOR (Offset: +${S.off||0}d)</div>
      <p class="text-xs text-slate-300 mb-2">Test nightly resets and Saturday auto-unlock.</p>
      <button onclick="S.off=(S.off||0)+1;render()" class="btn bg-yellow-300 text-black px-3 py-2 text-xs mr-2">NEXT DAY ⏭️</button>
      ${S.off?`<button onclick="S.off=0;render()" class="btn bg-slate-700 px-3 py-2 text-xs">TODAY</button>`:''}</div></div>`:''}`;
  }
}
render();
</script>
</body>
</html>
