<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SideChores // 8-Bit Quest Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0c14;
      --panel-bg: #151828;
      --neon-cyan: #00f5d4;
      --neon-pink: #ff2a85;
      --neon-lime: #39ff14;
      --neon-yellow: #ffe600;
      --neon-purple: #9b5de5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: 'VT323', monospace, sans-serif;
      font-size: 1.4rem;
      background-image: 
        linear-gradient(rgba(0, 245, 212, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 212, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .font-arcade { font-family: 'PressStart2P', 'Press Start 2P', monospace; }
    .pixel-box {
      background: var(--panel-bg);
      border: 4px solid #334155;
      box-shadow: 4px 4px 0px #000000;
    }
    .pixel-box-cyan { border-color: var(--neon-cyan); box-shadow: 4px 4px 0px rgba(0, 245, 212, 0.35); }
    .pixel-box-pink { border-color: var(--neon-pink); box-shadow: 4px 4px 0px rgba(255, 42, 133, 0.35); }
    .pixel-box-lime { border-color: var(--neon-lime); box-shadow: 4px 4px 0px rgba(57, 255, 20, 0.35); }
    .pixel-box-yellow { border-color: var(--neon-yellow); box-shadow: 4px 4px 0px rgba(255, 230, 0, 0.35); }

    .pixel-btn {
      font-family: 'PressStart2P', 'Press Start 2P', monospace;
      border: 3px solid #000;
      box-shadow: inset -3px -3px 0px rgba(0,0,0,0.35), 3px 3px 0px #000;
      transition: transform 0.08s;
      cursor: pointer;
    }
    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: inset -1px -1px 0px rgba(0,0,0,0.35), 1px 1px 0px #000;
    }
    .energy-cell {
      width: 100%;
      height: 22px;
      border: 2px solid #000;
      background: #1e293b;
    }
    .energy-cell.active-daily { background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
    .energy-cell.active-weekend { background: var(--neon-lime); box-shadow: 0 0 8px var(--neon-lime); }
  </style>
</head>
<body class="pb-16">
  <div id="app" class="max-w-xl mx-auto px-4 pt-4">
    <div class="pixel-box p-6 text-center mt-12">
      <div class="font-arcade text-cyan-300 text-sm mb-3 animate-pulse">LOADING ARCADE...</div>
      <div class="text-slate-400 text-lg">Initializing SideChores...</div>
    </div>
  </div>

  <script>
    // --- AUDIO ENGINE (8-Bit Web Audio) ---
    const AudioFX = {
      ctx: null,
      init() { 
        try {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {} 
      },
      play(freqs, dur = 0.08, type = 'square') {
        try {
          this.init();
          if (!this.ctx) return;
          freqs.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * dur);
            gain.gain.setValueAtTime(0.06, this.ctx.currentTime + i * dur);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (i + 1) * dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + i * dur);
            osc.stop(this.ctx.currentTime + (i + 1) * dur);
          });
        } catch (e) {}
      },
      coin() { this.play([987, 1318], 0.07); },
      powerup() { this.play([440, 554, 659, 880], 0.07); },
      error() { this.play([200, 140], 0.12, 'sawtooth'); },
      click() { this.play([600], 0.04); }
    };

    // --- CONSTANTS & HELPERS ---
    const STORAGE_KEY = 'sidechores_arcade_v4';
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const AVATARS = ['👾', '🤖', '🦖', '🚀', '⚡', '🦊', '🐉', '🎮'];

    function getTodayISO(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function getDayName(isoDate) {
      const parts = isoDate.split('-').map(Number);
      if (parts.length < 3) return 'Mon';
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return DAYS[dt.getDay()];
    }

    function getMondayOfWeek(isoDate) {
      const parts = isoDate.split('-').map(Number);
      if (parts.length < 3) return isoDate;
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      const day = dt.getDay();
      const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
      const mon = new Date(dt.setDate(diff));
      return mon.toISOString().split('T')[0];
    }

    function getWeekDates(mondayISO) {
      const parts = mondayISO.split('-').map(Number);
      if (parts.length < 3) return [];
      const res = [];
      for (let i = 0; i < 7; i++) {
        const dt = new Date(parts[0], parts[1] - 1, parts[2] + i);
        res.push(dt.toISOString().split('T')[0]);
      }
      return res;
    }

    function calcTierMinutes(pct, hasIncompleteEssential) {
      if (hasIncompleteEssential) return 0;
      if (pct >= 100) return 60;
      if (pct >= 75) return 30;
      if (pct >= 50) return 15;
      return 0;
    }

    // --- DEFAULT DATA ---
    function createDefaultState() {
      const today = getTodayISO();
      const mon = getMondayOfWeek(today);
      return {
        version: 4,
        parentPin: '1234',
        simulatedDayOffset: 0,
        lastActiveDate: today,
        currentWeekMonday: mon,
        children: [
          {
            id: 'c_james',
            name: 'James',
            avatar: '🚀',
            pin: '1234',
            dailySpentMins: 0,
            weekendBonusBank: 0,
            weekendBonusUnlockedForWeek: '',
            weekendSpentMins: 0
          },
          {
            id: 'c_harrison',
            name: 'Harrison',
            avatar: '🦖',
            pin: '1234',
            dailySpentMins: 0,
            weekendBonusBank: 0,
            weekendBonusUnlockedForWeek: '',
            weekendSpentMins: 0
          }
        ],
        tasks: [
          { id: 't1', title: 'Make Bed & Tidy Room', type: 'daily', essential: true, weekendMins: 0, assignedTo: 'all' },
          { id: 't2', title: 'Brush Teeth (AM & PM)', type: 'daily', essential: true, weekendMins: 0, assignedTo: 'all' },
          { id: 't3', title: 'Homework / Reading 20m', type: 'daily', essential: false, weekendMins: 0, assignedTo: 'all' },
          { id: 't4', title: 'Pack School Bag & Shoes', type: 'daily', essential: false, weekendMins: 0, assignedTo: 'all' },
          { id: 't5', title: 'Help Wash Car / Garden', type: 'weekend', essential: false, weekendMins: 20, assignedTo: 'all' },
          { id: 't6', title: 'Hoover Bedroom Floor', type: 'weekend', essential: false, weekendMins: 15, assignedTo: 'all' }
        ],
        completions: {},
        requests: []
      };
    }

    let state = loadState();
    let ui = {
      screen: 'select',
      pendingTarget: null,
      pinBuffer: '',
      pinError: false,
      activeChildId: null,
      parentTab: 'matrix',
      selectedChildForMatrix: state.children[0]?.id || 'c_james'
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.children) || parsed.children.length === 0) {
          return createDefaultState();
        }
        return parsed;
      } catch (e) {
        return createDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function getCurrentDate() {
      return getTodayISO(state.simulatedDayOffset || 0);
    }

    function syncCalendarRules() {
      try {
        const activeDate = getCurrentDate();
        const activeMonday = getMondayOfWeek(activeDate);
        const dayName = getDayName(activeDate);

        if (state.currentWeekMonday !== activeMonday) {
          state.currentWeekMonday = activeMonday;
          state.children.forEach(c => {
            c.weekendBonusBank = 0;
            c.weekendSpentMins = 0;
            c.weekendBonusUnlockedForWeek = '';
          });
        }

        if (state.lastActiveDate !== activeDate) {
          state.lastActiveDate = activeDate;
          state.children.forEach(c => {
            c.dailySpentMins = 0;
          });
          state.requests = state.requests.filter(r => r.pool !== 'daily');
        }

        if (dayName === 'Sat' || dayName === 'Sun') {
          state.children.forEach(c => {
            if (c.weekendBonusUnlockedForWeek !== activeMonday) {
              const wkStats = getWeeklyStats(c.id, activeMonday);
              c.weekendBonusBank = wkStats.unlockedMins;
              c.weekendBonusUnlockedForWeek = activeMonday;
            }
          });
        }
        saveState();
      } catch (e) {}
    }

    function getChildTasks(childId, type) {
      return state.tasks.filter(t => t.type === type && (t.assignedTo === 'all' || t.assignedTo === childId));
    }

    function getDailyStats(childId, dateISO) {
      const dailyTasks = getChildTasks(childId, 'daily');
      const doneIds = (state.completions[dateISO] && state.completions[dateISO][childId]) || [];
      const total = dailyTasks.length;
      const completed = dailyTasks.filter(t => doneIds.includes(t.id)).length;
      const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
      const essentialTasks = dailyTasks.filter(t => t.essential);
      const missingEssential = essentialTasks.some(t => !doneIds.includes(t.id));
      const earnedMins = calcTierMinutes(pct, missingEssential);
      return { total, completed, pct, missingEssential, earnedMins, doneIds };
    }

    function getWeeklyStats(childId, mondayISO) {
      const weekDates = getWeekDates(mondayISO);
      const monToFri = weekDates.slice(0, 5);
      const dailyTasks = getChildTasks(childId, 'daily');
      let totalPossible = dailyTasks.length * 5;
      let totalCompleted = 0;

      monToFri.forEach(d => {
        const doneIds = (state.completions[d] && state.completions[d][childId]) || [];
        totalCompleted += dailyTasks.filter(t => doneIds.includes(t.id)).length;
      });

      const pct = totalPossible === 0 ? 0 : Math.round((totalCompleted / totalPossible) * 100);
      const unlockedMins = calcTierMinutes(pct, false);
      return { totalPossible, totalCompleted, pct, unlockedMins, weekDates };
    }

    function getWeekendQuestEarnedMins(childId, mondayISO) {
      const weekDates = getWeekDates(mondayISO);
      if (weekDates.length < 7) return 0;
      const satSun = [weekDates[5], weekDates[6]];
      const wkTasks = getChildTasks(childId, 'weekend');
      let mins = 0;
      satSun.forEach(d => {
        const doneIds = (state.completions[d] && state.completions[d][childId]) || [];
        wkTasks.forEach(t => {
          if (doneIds.includes(t.id)) mins += Number(t.weekendMins || 0);
        });
      });
      return mins;
    }

    // --- ACTIONS ---
    window.openPinPad = function(target) {
      AudioFX.click();
      ui.screen = 'pin';
      ui.pendingTarget = target;
      ui.pinBuffer = '';
      ui.pinError = false;
      render();
    };

    window.pressPin = function(digit) {
      AudioFX.click();
      if (ui.pinBuffer.length >= 4) return;
      ui.pinBuffer += digit;
      ui.pinError = false;
      if (ui.pinBuffer.length === 4) {
        const expected = ui.pendingTarget === 'parent'
          ? state.parentPin
          : (state.children.find(c => c.id === ui.pendingTarget)?.pin || '1234');
        if (ui.pinBuffer === expected) {
          AudioFX.powerup();
          if (ui.pendingTarget === 'parent') {
            ui.screen = 'parent';
            if (!state.children.find(c => c.id === ui.selectedChildForMatrix) && state.children[0]) {
              ui.selectedChildForMatrix = state.children[0].id;
            }
          } else {
            ui.activeChildId = ui.pendingTarget;
            ui.screen = 'kid';
          }
          ui.pinBuffer = '';
        } else {
          AudioFX.error();
          ui
