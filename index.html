  <title>SideChores // 8-Bit Quest Tracker</title>

      --neon-lime: #39ff14;

      --neon-purple: #9b5de5;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      background-size: 24px 24px;
      min-height: 100vh;

    .font-arcade { font-family: 'Press Start 2P', cursive; }
