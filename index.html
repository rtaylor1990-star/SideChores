<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SideChores // 16-Bit Arcade Reward Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0c16;
      --panel-bg: #15172b;
      --neon-cyan: #00f5d4;
      --neon-pink: #ff2a85;
      --neon-lime: #aacc00;
      --neon-yellow: #fee440;
      --neon-purple: #9b5de5;
    }

    body {
      background-color: var(--bg-dark);
      color: #f0f4f8;
      font-family: 'VT323', monospace;
      font-size: 20px;
      background-image:
        radial-gradient(rgba(0, 245, 212, 0.08) 1px, transparent 1px),
        radial-gradient(rgba(255, 42, 133, 0.06) 1px, #0b0c16 1px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .font-arcade {
      font-family: 'Press Start 2P', cursive;
      line-height: 1.4;
    }

    .pixel-box {
      background: var(--panel-bg);
      border: 4px solid #2e335a;
      box-shadow:
        0 4px 0 #05060b,
        inset 0 0 0 2px rgba(255, 255, 255, 0.05);
    }

    .pixel-box-cyan {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.25), 0 4px 0 #007a6a;
    }

    .pixel-box-pink {
      border-color: var(--neon-pink);
      box-shadow: 0 0 12px rgba(255, 42, 133, 0.25), 0 4px 0 #8a0e43;
    }

    .pixel-box-yellow {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 12px rgba(254, 228, 64, 0.25), 0 4px 0 #8c7b0c;
    }

    .pixel-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 11px;
      text-transform: uppercase;
      border: 3px solid #fff;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.8);
      transition: transform 0.06s ease, box-shadow 0.06s ease;
      cursor: pointer;
    }

    .pixel-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.8);
    }

    .scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.22) 50%
      );
      background-size: 100% 4px;
    }

    .energy-segment {
      transition: all 0.25s ease;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }

    .glow-pulse {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body class="min-h-screen pb-16 scanlines">

  <!-- TOP ARCADE HUD -->
  <header class="sticky top-0 z-30 bg-[#0b0c16]/95 border-b-4 border-[#2e335a] px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#ff2a85] border-2 border-white flex items-center justify-center text-xl shadow-[0_3px_0_#7a0b3a]">
          🕹️
        </div>
        <div>
          <h1 class="font-arcade text-xs sm:text-sm text-[#00f5d4] tracking-wider">SIDECHORES</h1>
          <div id="hud-day-display" class="text-sm text-[#fee440] uppercase tracking-widest">LOADING...</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-sound-toggle" onclick="toggleSound()" class="pixel-btn bg-[#232747] text-[#00f5d4] border-[#00f5d4] px-2.5 py-2" title="Toggle 8-bit Audio">
          🔊
        </button>
        <button id="btn-logout" onclick="logout()" class="hidden pixel-btn bg-[#ff2a85] text-white border-white px-3 py-2">
          EXIT
        </button>
      </div>
    </div>
  </header>
